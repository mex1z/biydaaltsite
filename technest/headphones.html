<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Чихэвч — TechNest</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body data-page="headphones">
    <div id="navbar"></div>
    <main>
      <div class="page-header">
        <div class="container"><h1>Чихэвч</h1></div>
      </div>
      <div class="container py-5">
        <div class="row g-4">
          <aside class="col-lg-3">
            <div class="card p-3">
              <h5>Шүүлтүүр</h5>
              <label class="form-label mt-2">Дээд үнэ (₮)</label
              ><input
                class="form-control mb-3"
                type="number"
                id="max-price"
                placeholder="Жишээ: 2000000"
              />
              <h6>Брэнд</h6>
              <label class="form-check"
                ><input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="Apple"
                /><span class="form-check-label">Apple</span></label
              ><label class="form-check"
                ><input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="Samsung"
                /><span class="form-check-label">Samsung</span></label
              ><label class="form-check"
                ><input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="Xiaomi"
                /><span class="form-check-label">Xiaomi</span></label
              ><label class="form-check"
                ><input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="Sony"
                /><span class="form-check-label">Sony</span></label
              ><label class="form-check"
                ><input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="ASUS"
                /><span class="form-check-label">ASUS</span></label
              ><label class="form-check"
                ><input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="Lenovo"
                /><span class="form-check-label">Lenovo</span></label
              ><label class="form-check"
                ><input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="Logitech"
                /><span class="form-check-label">Logitech</span></label
              ><label class="form-check"
                ><input
                  class="form-check-input filter-brand"
                  type="checkbox"
                  value="Anker"
                /><span class="form-check-label">Anker</span></label
              >
            </div>
          </aside>
          <section class="col-lg-9">
            <div
              class="row g-3"
              id="headphones-grid"
              data-render-category="headphones"
            ></div>
          </section>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <div id="toast-box"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
