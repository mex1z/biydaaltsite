<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Бүртгүүлэх — TechNest</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body data-page="account">
    <div id="navbar"></div>
    <main>
      <div class="page-header">
        <div class="container"><h1>Бүртгүүлэх</h1></div>
      </div>
      <div class="container py-5">
        <div class="card auth-card p-4 shadow-sm">
          <h2 class="text-center mb-4">Бүртгүүлэх</h2>
          <form data-redirect="profile.html">
            <div class="mb-3">
              <label class="form-label">Нэр</label
              ><input class="form-control" type="text" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Имэйл</label
              ><input class="form-control" type="email" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Нууц үг</label
              ><input class="form-control" type="password" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Нууц үг давтах</label
              ><input class="form-control" type="password" required />
            </div>
            <button class="btn btn-primary w-100">Бүртгүүлэх</button>
          </form>
          <p class="text-center mt-3">
            Бүртгэлтэй юу? <a href="login.html">Нэвтрэх</a>
          </p>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <div id="toast-box"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
