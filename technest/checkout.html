<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Захиалга баталгаажуулах — TechNest</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body data-page="cart"><div id="navbar"></div><main><div class="page-header"><div class="container"><h1>Захиалга баталгаажуулах</h1></div></div><div class="container py-5"><div class="row g-4"><div class="col-lg-7"><form id="checkout-form" class="card p-4"><h4>Хүргэлтийн мэдээлэл</h4><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label">Нэр</label><input class="form-control" name="name" type="text" required></div><div class="col-md-6"><label class="form-label">Утас</label><input class="form-control" name="phone" type="tel" required></div><div class="col-md-6"><label class="form-label">Имэйл</label><input class="form-control" name="email" type="email" required></div><div class="col-md-6"><label class="form-label">Хот / дүүрэг</label><input class="form-control" name="city" type="text" required></div><div class="col-12"><label class="form-label">Дэлгэрэнгүй хаяг</label><input class="form-control" name="address" required></div><div class="col-12"><label class="form-label">Нэмэлт тэмдэглэл</label><textarea class="form-control" name="notes" rows="2"></textarea></div></div><h5 class="mt-4">Төлбөрийн хэлбэр</h5><label class="d-block"><input type="radio" name="payment" checked> Банкны карт</label><label class="d-block"><input type="radio" name="payment"> Банкны шилжүүлэг</label><label class="d-block"><input type="radio" name="payment"> Хүргэлтээр бэлнээр</label><button class="btn btn-primary mt-4">Захиалга баталгаажуулах</button></form></div><div class="col-lg-5"><div class="card p-4"><h4>Захиалгын хураангуй</h4><div id="checkout-summary"></div></div></div></div><script>document.addEventListener('DOMContentLoaded',()=>{const c=JSON.parse(localStorage.getItem('technest_cart')||'[]');document.getElementById('checkout-summary').innerHTML=c.map(x=>`<div class="d-flex justify-content-between py-2"><span>${x.name} × ${x.qty}</span><b>${(x.price*x.qty).toLocaleString()}₮</b></div>`).join('')||'<p>Сагс хоосон байна.</p>'})</script></div></main><div id="footer"></div><div id="toast-box"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/products.js"></script><script src="js/components.js"></script><script src="js/script.js"></script></body></html>
