<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Бүтээгдэхүүн — TechNest Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="p-3 text-white fw-bold">
          <i class="bi bi-cpu"></i>
          <span class="side-label">TechNest Admin</span>
        </div>
        <a href="admin-products.html"
          ><i class="bi bi-speedometer2"></i>
          <span class="side-label">Хянах самбар</span></a
        ><a href="admin-products.html"
          ><i class="bi bi-box-seam"></i>
          <span class="side-label">Бүтээгдэхүүн</span></a
        ><a href="admin-categories.html"
          ><i class="bi bi-grid"></i> <span class="side-label">Ангилал</span></a
        ><a href="admin-orders.html"
          ><i class="bi bi-bag"></i> <span class="side-label">Захиалга</span></a
        ><a href="admin-payments.html"
          ><i class="bi bi-credit-card"></i>
          <span class="side-label">Төлбөр</span></a
        ><a href="admin-customers.html"
          ><i class="bi bi-people"></i>
          <span class="side-label">Үйлчлүүлэгч</span></a
        ><a href="admin-news.html"
          ><i class="bi bi-newspaper"></i>
          <span class="side-label">Мэдээлэл</span></a
        ><a href="index.html" class="mt-4"
          ><i class="bi bi-arrow-left"></i>
          <span class="side-label">Сайт руу буцах</span></a
        >
      </aside>
      <main class="admin-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <small class="text-muted">TECHNEST / УДИРДЛАГА</small>
            <h1 class="h3 mb-0">Бүтээгдэхүүн</h1>
          </div>
          <span class="badge bg-light text-dark">Администратор</span>
        </div>
        <div class="d-flex gap-2 mb-3">
          <input
            class="form-control"
            id="admin-search"
            placeholder="Нэр, брэндээр хайх"
          /><button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#productModal"
          >
            Шинэ бүтээгдэхүүн
          </button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle bg-white">
            <thead>
              <tr>
                <th>ID</th>
                <th>Зураг</th>
                <th>Нэр</th>
                <th>Ангилал</th>
                <th>Үнэ</th>
                <th>Үлдэгдэл</th>
                <th>Үйлдэл</th>
              </tr>
            </thead>
            <tbody id="admin-product-rows"></tbody>
          </table>
        </div>
        <div class="modal fade" id="productModal">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5>Бүтээгдэхүүн нэмэх</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <label class="form-label">Ангиллын нэр</label
                ><input class="form-control" /><label class="form-label mt-3"
                  >Тайлбар</label
                ><textarea class="form-control"></textarea>
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">
                  Хаах</button
                ><button class="btn btn-primary" data-bs-dismiss="modal">
                  Хадгалах
                </button>
              </div>
            </div>
          </div>
        </div>
        <script>
          document.addEventListener("DOMContentLoaded", () => {
            const rows = document.getElementById("admin-product-rows");
            const draw = (q = "") => {
              rows.innerHTML = PRODUCTS.filter((p) =>
                (p.name + " " + p.brand)
                  .toLowerCase()
                  .includes(q.toLowerCase()),
              )
                .map(
                  (p) =>
                    `<tr><td>${p.id}</td><td><img class="thumb" src="${p.image}"></td><td>${p.name}</td><td>${p.category}</td><td>${p.price.toLocaleString()}₮</td><td>${12 + (parseInt(p.id.slice(-1)) || 0)}</td><td><button class="btn btn-sm btn-outline-primary">Засах</button> <button class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove()">Устгах</button></td></tr>`,
                )
                .join("");
            };
            draw();
            document
              .getElementById("admin-search")
              .addEventListener("input", (e) => draw(e.target.value));
          });
        </script>
      </main>
    </div>
    <div id="toast-box"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
