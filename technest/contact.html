<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Холбоо барих — TechNest</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body data-page="contact">
    <div id="navbar"></div>
    <main>
      <div class="page-header">
        <div class="container"><h1>Холбоо барих</h1></div>
      </div>
      <div class="container py-5">
        <div class="row g-4">
          <div class="col-md-5">
            <h3>Холбоо барих мэдээлэл</h3>
            <p>
              <i class="bi bi-geo-alt text-primary"></i> Улаанбаатар хот,
              Сүхбаатар дүүрэг
            </p>
            <p><i class="bi bi-telephone text-primary"></i> +976 7700-2026</p>
            <p><i class="bi bi-envelope text-primary"></i> info@technest.mn</p>
            <p>
              <i class="bi bi-clock text-primary"></i> Даваа–Бямба, 09:00–18:00
            </p>
            <div class="muted-box text-center py-5">
              <i class="bi bi-map display-5 text-primary"></i>
              <p class="mb-0 mt-2">TechNest байршил · Улаанбаатар</p>
            </div>
          </div>
          <div class="col-md-7">
            <form class="card p-4" data-toast="Мессеж илгээгдлээ">
              <h3>Бидэнд зурвас илгээх</h3>
              <label class="form-label mt-3">Нэр</label
              ><input class="form-control" required /><label
                class="form-label mt-3"
                >Имэйл</label
              ><input class="form-control" type="email" required /><label
                class="form-label mt-3"
                >Гарчиг</label
              ><input class="form-control" required /><label
                class="form-label mt-3"
                >Зурвас</label
              ><textarea class="form-control" rows="5" required></textarea
              ><button class="btn btn-primary mt-3">Илгээх</button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <div id="toast-box"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
